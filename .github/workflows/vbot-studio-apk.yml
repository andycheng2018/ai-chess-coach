name: VBOT Studio Android APK
# Separate package and release tags from Chess Buddy; same permanent signing identity.
# Publication requires source tests, pinned-signature verification and emulator checks.
on:
  workflow_dispatch:
  push:
    branches: [codex/vbot-app-scaffold]
    paths:
      - 'vbot-app/**'
      - 'server/vbot_app_control.py'
      - 'server/vbot_networks.py'
      - 'server/vbot_ssh.py'
      - 'scripts/android_signing.py'
      - 'scripts/verify_android_signature.py'
      - 'android/signing-certificate.sha256'
      - 'tests/vbot_app_*'
      - 'tests/vbotAppLoader.mjs'
      - 'tests/test_vbot_app_*'
      - 'tests/fixtures/vbot_app_scores.json'
      - '.github/workflows/vbot-studio-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore permanent signing identity and assign Studio version
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python scripts/android_signing.py restore
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Run the app's tests
        run: |
          python -m pip install -r requirements.txt
          node --test tests/vbot_app_*.test.mjs
          python -m unittest tests/test_vbot_app_control.py tests/test_vbot_app_android.py
      - run: npm run vbot:build
      - name: Copy the built app into the Android project
        working-directory: vbot-app
        run: npx cap sync android
      - name: Build the signed Studio APK
        working-directory: vbot-app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Package
        run: |
          mkdir -p apk
          cp vbot-app/android/app/build/outputs/apk/release/app-release.apk apk/VBOT-Studio-Android.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs apk/VBOT-Studio-Android.apk > apk/signature.txt
          python scripts/verify_android_signature.py apk/signature.txt android/signing-certificate.sha256
          sha256sum apk/VBOT-Studio-Android.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VBOT-Studio-Android
          path: apk/
          retention-days: 30
      - name: Allow this runner to use its emulator accelerator
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Check the embedded controller on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd vbot-app/android && ./gradlew :app:connectedReleaseAndroidTest --no-daemon
      - name: Save the emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VBOT-Studio-emulator-results
          path: vbot-app/android/app/build/outputs/androidTest-results/
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/chessbuddy-release.p12"
  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VBOT-Studio-Android
          path: apk
      - name: Publish the validated Studio app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          tag="vbot-studio-v$code"
          cat > notes.md <<EOF
          VBOT Studio Android 0.1.$code. Separate app: com.andy.vbotstudio.

          Includes the integrated action library, rehearsed dance catalog and performance editor.
          Qwen voice/session controls in the web app require the computer-side Studio server;
          the standalone Android controller does not provide that cloud voice service yet.

          Signed with the permanent pinned release certificate. Source tests, APK signature
          verification and Android emulator controller checks passed.
          Source commit: $BUILD_SHA

          If Android refuses to update an older debug-signed Studio app, export saved shows
          before migrating. Do not uninstall until your data is backed up. Future permanently
          signed Studio releases can update this version in place. Chess Buddy is unaffected.
          EOF
          gh release create "$tag" apk/* --repo "$GH_REPO" --target "$BUILD_SHA" --title "VBOT Studio Android 0.1.$code" --notes-file notes.md --latest=false
