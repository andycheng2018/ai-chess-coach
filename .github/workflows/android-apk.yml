name: Android tablet APK
on:
  workflow_dispatch:
  push:
    branches: [codex/android-tablet]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable demo APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify and package
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/ChessBuddy-Android-demo.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs apk/ChessBuddy-Android-demo.apk
          sha256sum apk/ChessBuddy-Android-demo.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-Android-tablet
          path: apk/
          retention-days: 30
