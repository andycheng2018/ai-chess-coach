apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def releaseKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
def releasePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseSigningReady = releaseKeystore && releasePassword
def buildNumber = (System.getenv('ANDROID_VERSION_CODE') ?: '107').toInteger()

android {
    namespace = "com.andy.chessbuddy"
    compileSdk = rootProject.ext.compileSdkVersion
    testBuildType 'release'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.andy.chessbuddy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        persistent {
            if (releaseSigningReady) {
                storeFile file(releaseKeystore)
                storeType 'PKCS12'
                storePassword releasePassword
                keyAlias 'chessbuddy'
                keyPassword releasePassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.persistent
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libstockfish.so'] }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') doFirst {
        if (!releaseSigningReady) throw new GradleException('Release builds require ANDROID_KEYSTORE_PATH and ANDROID_KEYSTORE_PASSWORD. Never generate a new signing key for an update.')
    }
}

tasks.register('copyChessPython', Sync) {
    into layout.buildDirectory.dir('generated/chessPython')
    from('../../server') { into 'server'; include '**/*.py', '**/*.json', '**/*.tsv', '**/*.txt' }
    from('../../audit-dashboard') { into 'audit-dashboard'; include 'index.html' }
    from('../../src') { into 'src'; include 'captureExercises.json' }
    from('../../vbot-demo') { into 'vbot-demo'; include 'index.html' }
}

chaquopy {
    defaultConfig {
        version '3.13'
        pip {
            // Upstream publishes this version as source only. Build its pure
            // Python wheel on the host before Chaquopy's cross-platform install.
            install 'wheels/chess-1.11.2-py3-none-any.whl'
            install 'requests==2.32.5'
            install 'python-dotenv==1.1.1'
            install 'PyYAML==6.0.3'
            install 'qrcode==8.2'
        }
        extractPackages 'server'
    }
    sourceSets {
        main { srcDirs = ['src/main/python', "$buildDir/generated/chessPython"] }
    }
}
tasks.configureEach { if (name != 'copyChessPython' && name.toLowerCase().contains('python')) dependsOn 'copyChessPython' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:0.2.24'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
